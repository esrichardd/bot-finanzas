# Prod. Variables desde el .env de la raíz.
# ${VAR:?} = falla al levantar si la variable no existe (sin defaults en prod).
#
# Topología de redes:
#   internal (internal: true) → sin acceso a/desde fuera del host. Solo Postgres y quien deba hablarle.
#   web                       → comunicación entre backend, frontend y Caddy, con salida a internet.
#   admin                     → permite publicar el proxy administrativo solo en el loopback del host.
# Postgres: SOLO internal, sin puertos publicados ni salida por otra red.
# postgres-admin-proxy: internal + admin, con binding 127.0.0.1:15432 detrás de SSH.
# Backend: internal + web.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerida}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-admin-proxy:
    build:
      context: ./postgres-admin
    user: haproxy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:15432:15432"
    networks:
      - internal
      - admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal # hablar con postgres
      - web # salir a internet; Caddy le llegará por aquí (sin puertos al host)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      # Fetches server-side del frontend van directo al backend por la red interna del compose.
      BACKEND_URL: http://backend:3000
    restart: unless-stopped
    logging: *default-logging
    networks:
      - web
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - backend
      - frontend

networks:
  internal:
    internal: true
  admin:
    driver: bridge
  web:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
