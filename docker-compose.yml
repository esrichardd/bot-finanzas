# Dev. Variables desde el .env de la raíz (interpolación automática de Compose).
# Defaults con :- para que dev funcione out-of-the-box incluso sin .env.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:5432:5432" # solo loopback: tooling local (psql, drizzle-kit studio)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
    environment:
      # La topología (host "postgres") es del compose, no del .env.
      # Esta var pisa cualquier DATABASE_URL del env_file.
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    working_dir: /app
    command: npm run dev
    volumes:
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
