name: CI and production deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_required: ${{ steps.deployment.outputs.deploy_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          deploy_required=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_required=true
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
              deploy_required=true
            else
              while IFS= read -r changed_file; do
                [[ -n "${changed_file}" ]] || continue

                case "${changed_file}" in
                  docs/* | *.md)
                    ;;
                  *)
                    printf 'Runtime change detected: %s\n' "${changed_file}"
                    deploy_required=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
            fi
          fi

          printf 'deploy_required=%s\n' "${deploy_required}" | tee -a "${GITHUB_OUTPUT}"

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pinned pnpm version
        working-directory: frontend
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  deploy:
    name: Deploy production
    needs:
      - changes
      - backend
      - frontend
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.deploy_required == 'true' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configure restricted SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Missing VPS_SSH_KNOWN_HOSTS secret}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/finanzas_deploy"
          printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/finanzas_deploy" "${HOME}/.ssh/known_hosts"

      - name: Deploy exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          ssh \
            -i "${HOME}/.ssh/finanzas_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${VPS_USER}@${VPS_HOST}" \
            "deploy ${COMMIT_SHA}"

      - name: Verify public health endpoint
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            https://finanzas.esrichard.dev/health
